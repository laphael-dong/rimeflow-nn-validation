[package]
name = "rimeflow-yolov8n"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "YOLOv8n inference — pure Rust postprocess + shared wgpu preprocess + onnxruntime-web (WebGPU) / pykeio-ort (CoreML/DirectML/CUDA/NNAPI) backends"
repository = "https://github.com/caozisheng/rimeflow-yolov8n"
homepage = "https://github.com/caozisheng/rimeflow-yolov8n"
keywords = ["yolov8", "onnx", "wgpu", "wasm", "computer-vision"]
categories = ["computer-vision", "wasm", "multimedia::images"]
publish = false
build = "build.rs"

[features]
default = []

# Native ONNX Runtime backends — consumers opt in per platform.
# Enabling `native` alone gives a CPU-only baseline.
native            = ["dep:ort", "dep:pollster", "dep:thiserror", "ort/download-binaries", "ort/tls-rustls"]
native-coreml     = ["native", "ort/coreml"]
native-directml   = ["native", "ort/directml"]
native-cuda       = ["native", "ort/cuda"]
native-tensorrt   = ["native", "ort/tensorrt"]
native-nnapi      = ["native", "ort/nnapi"]
native-qnn        = ["native", "ort/qnn"]
native-openvino   = ["native", "ort/openvino"]

# Embed models/yolov8n.onnx as a `pub const MODEL_BYTES: &[u8]` — convenient for
# native consumers that don't want to ship a separate .onnx file. Desktop
# default-on; mobile default-off (bundle size sensitive).
model-embedded    = []

# Preprocess is a Rust wgpu ComputePipeline (§4 in the design doc). Both wasm
# (WebGPU backend) and native (Metal / Dx12 / Vulkan / GL) need wgpu.
[dependencies]
wgpu     = { version = "29", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
# GPU* features — used by ort_bridge::extract_web_gpu_buffer and the extern
# block generated by build.rs to accept a shared GPUBuffer.
# HtmlCanvasElement / OffscreenCanvas — used by the transition ort_detect API.
web-sys = { version = "0.3", features = [
  "Gpu",
  "GpuAdapter",
  "GpuBuffer",
  "GpuDevice",
  "GpuQueue",
  "HtmlCanvasElement",
  "OffscreenCanvas",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort       = { version = "=2.0.0-rc.12", default-features = false, optional = true }
pollster  = { version = "0.4", optional = true }
thiserror = { version = "1", optional = true }
