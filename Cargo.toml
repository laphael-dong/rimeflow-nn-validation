[package]
name = "rimeflow-yolov8n"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "YOLOv8n operator crate for the rimeflow family: pure-Rust postprocess + shared wgpu preprocess (via rimeflow-onnx-base) + web/native ORT bridges + Ultralytics YOLOv8n ONNX weights."
repository = "https://github.com/caozisheng/rimeflow-yolov8n"
homepage = "https://github.com/caozisheng/rimeflow-yolov8n"
keywords = ["yolov8", "onnx", "wgpu", "wasm", "computer-vision"]
categories = ["computer-vision", "wasm", "multimedia::images"]
publish = false
build = "build.rs"

[features]
default = []

# Pass-through of rimeflow-onnx-base features. Consumers list e.g.
# `rimeflow-yolov8n/native-directml`; the flag is forwarded 1:1.
native            = ["rimeflow-onnx-base/native"]
native-coreml     = ["native", "rimeflow-onnx-base/native-coreml"]
native-directml   = ["native", "rimeflow-onnx-base/native-directml"]
native-cuda       = ["native", "rimeflow-onnx-base/native-cuda"]
native-tensorrt   = ["native", "rimeflow-onnx-base/native-tensorrt"]
native-nnapi      = ["native", "rimeflow-onnx-base/native-nnapi"]
native-qnn        = ["native", "rimeflow-onnx-base/native-qnn"]
native-openvino   = ["native", "rimeflow-onnx-base/native-openvino"]

# Embed models/yolov8n.onnx as `pub const MODEL_BYTES: &[u8]`. Desktop
# default-on; mobile default-off (bundle size sensitive).
model-embedded    = []

# rimeflow-onnx-base is fetched from GitHub. For local co-development against
# a checkout under `../rimeflow-onnx-base/`, add a workspace-root `[patch]`
# section (rimecut's Cargo.toml has the reference pattern).
[dependencies]
rimeflow-onnx-base = { git = "https://github.com/caozisheng/rimeflow-onnx-base", branch = "main" }
wgpu     = { version = "29", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys = { version = "0.3", features = [
  "Gpu",
  "GpuAdapter",
  "GpuBuffer",
  "GpuDevice",
  "GpuQueue",
  "HtmlCanvasElement",
  "OffscreenCanvas",
] }

[build-dependencies]
rimeflow-onnx-base = { git = "https://github.com/caozisheng/rimeflow-onnx-base", branch = "main", features = ["build-helper"] }
